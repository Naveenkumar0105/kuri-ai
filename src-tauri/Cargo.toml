[package]
name = "kuri-desktop"
version = "0.1.0"
description = "Kuri's system-wide companion"
authors = ["Kuri"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "kuri-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
